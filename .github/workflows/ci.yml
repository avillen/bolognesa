name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bolognesa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bolognesa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.3.3

      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-28.3.3-elixir-1.20.3-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-28.3.3-elixir-1.20.3-

      - run: mix deps.get --check-locked

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - run: mix test
