name: README screenshots

on:
  # Run manually with update=true on a branch to commit captures rendered by CI,
  # which is the single source of truth for the README images.
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate and commit README screenshots on this branch
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "config/**"
      - "priv/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "docs/screenshots/**"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "config/**"
      - "priv/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "docs/screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: ${{ inputs.update == true }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.3.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore screenshot dependencies and build
        id: screenshot-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/screenshots
          key: ${{ runner.os }}-screenshots-build-v2-otp-28.3.3-elixir-1.20.3-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-screenshots-build-v2-otp-28.3.3-elixir-1.20.3-

      - name: Install Mix dependencies
        run: mix deps.get --check-locked

      - name: Compile screenshot environment
        run: MIX_ENV=screenshots mix compile

      - name: Save screenshot dependencies and build
        if: steps.screenshot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            deps
            _build/screenshots
          key: ${{ steps.screenshot-cache.outputs.cache-primary-key }}

      - name: Install Node dependencies
        run: npm ci

      - name: Verify README screenshots
        if: inputs.update != true
        run: make check-screenshots

      - name: Regenerate and commit README screenshots
        if: inputs.update == true
        run: |
          make screenshots
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "README screenshots already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(screenshots): regenerate README captures in CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve failed synthetic captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: readme-capture-failure
          path: /tmp/bolognesa-screenshots.*/output/*.png
          retention-days: 3

  video:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci

      - name: Verify vendored Video.js bundle
        run: |
          npm run vendor-videojs
          git diff --exit-code -- assets/vendor/videojs.min.mjs assets/vendor/videojs.LICENSE

      - name: Verify browser hook contracts
        run: npm test

      - name: Install video verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chrome

      - name: Verify Video.js with synthetic MP4 and HLS
        env:
          BOLOGNESA_TEST_BROWSER_CHANNEL: chrome
        run: |
          mkdir -p tmp/videojs-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:size=320x180:rate=24 -t 20 -an -c:v libx264 -preset ultrafast -g 24 -pix_fmt yuv420p -movflags +faststart tmp/videojs-fixtures/sample.mp4
          ffmpeg -hide_banner -loglevel error -i tmp/videojs-fixtures/sample.mp4 -c copy -hls_time 2 -hls_list_size 0 -hls_segment_filename 'tmp/videojs-fixtures/segment%03d.ts' tmp/videojs-fixtures/index.m3u8
          npm run test-video-player -- tmp/videojs-fixtures
