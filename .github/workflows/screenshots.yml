name: README screenshots

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "config/**"
      - "priv/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "config/**"
      - "priv/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.3.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Mix dependencies
        run: mix deps.get --check-locked

      - name: Install Node dependencies
        run: npm ci

      - name: Verify vendored Video.js bundle
        run: |
          npm run vendor-videojs
          git diff --exit-code -- assets/vendor/videojs.min.mjs assets/vendor/videojs.LICENSE

      - name: Verify browser hook contracts
        run: node --test assets/test/*.mjs

      - name: Install video verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chrome

      - name: Verify Video.js with synthetic MP4 and HLS
        env:
          BOLOGNESA_TEST_BROWSER_CHANNEL: chrome
        run: |
          mkdir -p tmp/videojs-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:size=320x180:rate=24 -t 20 -an -c:v libx264 -preset ultrafast -g 24 -pix_fmt yuv420p -movflags +faststart tmp/videojs-fixtures/sample.mp4
          ffmpeg -hide_banner -loglevel error -i tmp/videojs-fixtures/sample.mp4 -c copy -hls_time 2 -hls_list_size 0 -hls_segment_filename 'tmp/videojs-fixtures/segment%03d.ts' tmp/videojs-fixtures/index.m3u8
          npm run test-video-player -- tmp/videojs-fixtures

      - name: Verify README screenshots
        run: make check-screenshots

      - name: Preserve failed synthetic captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: readme-capture-failure
          path: /tmp/bolognesa-screenshots.*/output/*.png
          retention-days: 3
