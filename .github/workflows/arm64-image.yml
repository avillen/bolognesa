name: ARM64 image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Start timer
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            BOLOGNESA_LAN_HTTP=true
          push: true
          tags: ghcr.io/avillen/bolognesa-lan:sha-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=bolognesa-arm64
          cache-to: type=gha,scope=bolognesa-arm64,mode=max,ignore-error=true

      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          image="ghcr.io/avillen/bolognesa-lan@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image"
          printf 'commit=%s\nimage=%s\n' "$COMMIT_SHA" "$image" > image-ref.txt
          duration_seconds=$(($(date +%s) - BUILD_STARTED))
          {
            echo "Commit: ${COMMIT_SHA}"
            echo "Image: ${image}"
            echo "Requested platform: linux/arm64"
            echo "Build and publication: ${duration_seconds} s"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: qnap-image-ref
          path: image-ref.txt
          if-no-files-found: error
          retention-days: 30
