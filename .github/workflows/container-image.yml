name: Container image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require deployment secrets
        env:
          SECRET_KEY_BASE: validation-only
        run: |
          if docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet 2>compose-empty-secrets.log; then
            cat compose-empty-secrets.log
            echo "Compose accepted empty deployment secrets" >&2
            exit 1
          fi
          grep -q "POSTGRES_PASSWORD" compose-empty-secrets.log

      - name: Require Phoenix secret
        env:
          POSTGRES_PASSWORD: validation-only
        run: |
          if docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet 2>compose-empty-phoenix-secret.log; then
            cat compose-empty-phoenix-secret.log
            echo "Compose accepted an empty Phoenix secret" >&2
            exit 1
          fi
          grep -q "SECRET_KEY_BASE" compose-empty-phoenix-secret.log

      - name: Validate generic Compose configuration
        env:
          SECRET_KEY_BASE: validation-only
          POSTGRES_PASSWORD: validation-only
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet

      - name: Validate deployment script syntax
        run: |
          for script in deploy/compose/scripts/*.sh; do
            bash -n "$script"
          done

      - name: Verify configurable deployment contracts
        run: |
          sh test/deploy/compose-config-test.sh
          bash test/deploy/compose-update-test.sh
          bash test/deploy/compose-database-test.sh
          bash test/deploy/compose-transport-test.sh
          bash test/deploy/compose-release-test.sh

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-compose
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, variant: secure, lan: "false"}
          - {arch: arm64, runner: ubuntu-24.04-arm, variant: secure, lan: "false"}
          - {arch: amd64, runner: ubuntu-24.04, variant: lan, lan: "true"}
          - {arch: arm64, runner: ubuntu-24.04-arm, variant: lan, lan: "true"}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Select image namespace
        id: namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: BOLOGNESA_LAN_HTTP=${{ matrix.lan }}
          outputs: type=image,name=${{ steps.namespace.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=bolognesa-native-${{ matrix.variant }}-${{ matrix.arch }}
            type=gha,scope=bolognesa-arm64
          cache-to: type=gha,scope=bolognesa-native-${{ matrix.variant }}-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Record platform digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > digest.txt
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digest.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          path: digests
      - name: Assemble and verify multi-architecture images
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          for variant in secure lan; do
            amd64=$(cat "digests/digest-${variant}-amd64/digest.txt")
            arm64=$(cat "digests/digest-${variant}-arm64/digest.txt")
            [[ $amd64 =~ ^sha256:[0-9a-f]{64}$ && $arm64 =~ ^sha256:[0-9a-f]{64}$ ]]
            suffix=
            if [ "$variant" = lan ]; then suffix=-lan; fi
            docker buildx imagetools create --metadata-file "$variant.json" \
              -t "$image:sha-${COMMIT_SHA}${suffix}" -t "$image:latest${suffix}" \
              "$image@$amd64" "$image@$arm64"
            digest=$(jq -er '."containerimage.descriptor".digest' "$variant.json")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$image@$digest"
            docker buildx imagetools inspect --raw "$image@$digest" | \
              jq -e '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
            {
              echo "Commit: $COMMIT_SHA"
              echo "Variant: $variant"
              echo "Image: $image@$digest"
              echo "Verified platforms: linux/amd64, linux/arm64"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$variant" = lan ]; then
              printf 'variant=lan\ncommit=%s\nimage=%s\n' "$COMMIT_SHA" "$image@$digest" > image-ref.txt
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: server-image-ref
          path: image-ref.txt
          if-no-files-found: error
          retention-days: 30
