name: Container image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require deployment secrets
        run: |
          if docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet 2>compose-empty-secrets.log; then
            cat compose-empty-secrets.log
            echo "Compose accepted empty deployment secrets" >&2
            exit 1
          fi
          grep -q "POSTGRES_PASSWORD" compose-empty-secrets.log

      - name: Validate generic Compose configuration
        env:
          SECRET_KEY_BASE: validation-only
          POSTGRES_PASSWORD: validation-only
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish secure multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/avillen/bolognesa:sha-${{ github.sha }}
            ghcr.io/avillen/bolognesa:latest
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=bolognesa-multiarch
          cache-to: type=gha,scope=bolognesa-multiarch,mode=max,ignore-error=true

      - name: Inspect immutable image and record digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          image="ghcr.io/avillen/bolognesa@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image"
          {
            echo "Commit: ${COMMIT_SHA}"
            echo "Image: ${image}"
            echo "Requested platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
