# Copy to media.local.yaml and customize the list for your installation.
services:
  app:
    environment:
      BOLOGNESA_LIBRARY_ROOTS: /media/movies:/media/series:/media/music
    volumes: !override
      - type: bind
        source: ${MOVIES_PATH:?Set MOVIES_PATH}
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SERIES_PATH:?Set SERIES_PATH}
        target: /media/series
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MUSIC_PATH:?Set MUSIC_PATH}
        target: /media/music
        read_only: true
        bind:
          create_host_path: false
