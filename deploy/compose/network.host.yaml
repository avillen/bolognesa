# Linux host networking; PostgreSQL remains accessible only on loopback.
services:
  db:
    network_mode: host
    environment:
      PGPORT: "${DB_PORT:-5432}"
    command: [postgres, -c, listen_addresses=127.0.0.1, -p, "${DB_PORT:-5432}"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p ${DB_PORT:-5432} -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
  app:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: ecto://bolognesa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:${DB_PORT:-5432}/bolognesa
      BIND_IP: ${BOLOGNESA_BIND_IP:-127.0.0.1}
      PORT: "${BOLOGNESA_PORT:-4000}"
